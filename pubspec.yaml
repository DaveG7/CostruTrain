name: costrutrain
description: "Privacy-first workout composer and player."
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  drift: ^2.20.2
  drift_flutter: ^0.2.1
  shared_preferences: ^2.3.0
  flutter_cache_manager: ^3.4.1
  intl: ^0.20.0
  flutter_native_splash: ^2.4.1
  cached_network_image: ^3.4.1
  lucide_icons: ^0.257.0
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  uuid: ^4.4.0
  audioplayers: ^6.0.0
  wakelock_plus: ^1.2.0
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  drift_dev: ^2.20.2
  riverpod_generator: ^2.4.3
  riverpod_lint: ^2.3.13
  custom_lint: ^0.7.6

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/seed/exercises.json
    - assets/seed/templates.json
    - assets/audio/
