name: Release Build

on:
  push:
    tags:
      - 'v*'
  # Dry run: builds and signs exactly like a real release, prints the certificate
  # fingerprint, and uploads the APKs as workflow artifacts — but creates NO
  # GitHub Release. Use this to rehearse signing before the first v* tag, since
  # a tag publishes irreversibly and binds every future update to that key.
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Pinned for the same reason as Flutter below: ubuntu-latest's default JDK
      # drifts, and Gradle 8.14 / AGP 8.11.1 only accept a bounded range. 17 matches
      # sourceCompatibility/jvmTarget in android/app/build.gradle.kts.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Pinned deliberately. Flutter 3.44+ made IconData final, which breaks
          # lucide_icons. Do not float this to '3.x' or 'stable'.
          flutter-version: '3.41.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # A tag push publishes a public GitHub Release. Android binds updates to the
      # signing key, so a debug-signed APK reaching users cannot be replaced later
      # without a reinstall — which wipes every workout and session of this
      # offline-first app. Fail loudly instead of silently falling back to debug.
      - name: Verify signing secrets are present
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_STORE_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            echo "::error::Refusing to publish a debug-signed release. Add them under Settings > Secrets and variables > Actions, then re-push the tag."
            exit 1
          fi

      # Decoded outside the workspace so the keystore can never be swept into a
      # build output or an uploaded artifact.
      - name: Decode keystore and write key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/costrutrain-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          # Fails fast on a truncated or mis-encoded secret, before Gradle turns it
          # into an opaque "Keystore was tampered with" stack trace.
          if command -v keytool > /dev/null; then
            keytool -list -keystore "$keystore" -storepass "$ANDROID_STORE_PASSWORD" > /dev/null
          else
            echo "::warning::keytool not on PATH; skipping keystore readability check."
          fi

          # storeFile must be absolute: relative paths resolve against android/app/.
          umask 077
          cat > android/key.properties <<EOF
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storeFile=$keystore
          storePassword=$ANDROID_STORE_PASSWORD
          EOF

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      # Last line of defence: build.gradle.kts falls back to the debug key whenever
      # key.properties is absent, so a silent failure above would still produce
      # installable-looking APKs. Refuse to publish those.
      - name: Assert APKs are not debug-signed
        run: |
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner=$(find "$sdk/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner not found under '$sdk/build-tools'; cannot verify signatures."
            exit 1
          fi
          {
            echo "## Signing verification"
            echo
            echo "Compare the SHA-256 below against your local keystore:"
            echo '```'
            echo 'keytool -list -v -keystore ~/costrutrain-release.jks'
            echo '```'
            echo
            echo "| APK | Certificate SHA-256 |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            echo "--- $apk"
            certs=$("$apksigner" verify --print-certs "$apk")
            echo "$certs"
            if echo "$certs" | grep -q "CN=Android Debug"; then
              echo "::error::$apk is signed with the Android debug key."
              exit 1
            fi
            sha=$(echo "$certs" | grep -m1 "SHA-256 digest" | sed 's/.*digest: //')
            echo "| \`$(basename "$apk")\` | \`$sha\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      # Dry run only: lets the signed APK be installed and tested without a public
      # release existing. Artifacts inherit the repo's visibility and expire on the
      # repo's retention setting.
      - name: Upload APKs as artifacts (dry run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 7

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/costrutrain-release.jks"

      # Tag pushes only. A manual dry run must never publish — that is its whole point.
      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          generate_release_notes: true
