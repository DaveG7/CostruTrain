name: Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pinned deliberately. Flutter 3.44+ made IconData final, which breaks
          # lucide_icons. Do not float this to '3.x' or 'stable'.
          flutter-version: '3.41.9'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Phase 4b TODO: inject keystore credentials from GitHub Secrets for production signing.
      # Current behaviour: falls back to debug signing (acceptable for sideload/testing APKs).
      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          generate_release_notes: true
